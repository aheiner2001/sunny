<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
    <defs>
      <linearGradient id="g-time" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00c3e3"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
    </defs>
    <rect width="120" height="120" rx="28" fill="url(#g-time)"/>
    <!-- Minimalist clean circular clock -->
    <circle cx="60" cy="60" r="38" fill="#ffffff"/>
    <circle cx="60" cy="60" r="32" fill="#f0fdfa"/>
    <circle cx="60" cy="60" r="4" fill="#0284c7"/>
    <line x1="60" y1="60" x2="60" y2="38" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="60" x2="78" y2="60" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
    <!-- 4 discrete clean ticks -->
    <circle cx="60" cy="33" r="2" fill="#38bdf8"/>
    <circle cx="87" cy="60" r="2" fill="#38bdf8"/>
    <circle cx="60" cy="87" r="2" fill="#38bdf8"/>
    <circle cx="33" cy="60" r="2" fill="#38bdf8"/>
  </svg>