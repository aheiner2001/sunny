<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-set" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg-set)"/>
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="130" fill="none" stroke="url(#gear-grad)" stroke-width="46" stroke-dasharray="40 25"/>
    <circle cx="256" cy="256" r="65" fill="#00c3e3"/>
    <circle cx="256" cy="256" r="32" fill="#ffffff"/>
  </g>
</svg>