<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sunny Fleet - Redirecting...</title>
  <script>
    // GitHub Pages Single Page App redirect
    // Encodes the path & query into a query parameter on the base path
    var pathSegmentsToKeep = 1; // e.g. 1 keeps '/sunny'
    var l = window.location;
    
    // Calculate base path (e.g. /sunny/)
    var pathParts = l.pathname.split('/');
    var basePath = pathParts.slice(0, 1 + pathSegmentsToKeep).join('/') + '/';
    
    // Remaining path after base path
    var routePath = pathParts.slice(1 + pathSegmentsToKeep).join('/');
    var fullRoute = '/' + routePath + l.search + l.hash;

    // Store in sessionStorage as backup and redirect with ?p=
    sessionStorage.setItem('spa-redirect-path', fullRoute);
    
    // Redirect to base path preserving target route
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      basePath + '?p=' + encodeURIComponent(fullRoute)
    );
  </script>
</head>
<body>
  <p>Redirecting to Sunny Fleet...</p>
</body>
</html>
